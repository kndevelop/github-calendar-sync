name: ToDo
description: タスクを登録します
title: "[TODO] "
labels:
  - todo

body:
  - type: input
    id: summary
    attributes:
      label: タスク名
      description: Googleカレンダーの予定名になります。
      placeholder: API設計レビュー
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 詳細
      description: 必要に応じて記入してください。
      placeholder: |
        ・レビュー対象
        ・参考資料
        ・注意事項

  - type: input
    id: start
    attributes:
      label: 開始日時
      description: YYYY-MM-DD HH:mm
      placeholder: 2026-08-01 10:00
    validations:
      required: true

  - type: input
    id: end
    attributes:
      label: 終了日時
      description: YYYY-MM-DD HH:mm
      placeholder: 2026-08-01 11:00
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 高
        - 中
        - 低
      default: 1

  - type: dropdown
    id: calendar
    attributes:
      label: カレンダー
      description: 登録先を選択してください。
      options:
        - 個人
        - 仕事
        - その他
      default: 0

  - type: checkboxes
    id: options
    attributes:
      label: オプション
      options:
        - label: 終日予定
        - label: Google Meetを作成
        - label: リマインダーを設定

  - type: textarea
    id: memo
    attributes:
      label: メモ
      description: 任意
